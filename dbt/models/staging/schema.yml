version: 2

models:
  - name: stg_stock_prices
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [price_date, ticker]
    columns:
      - name: close_price
        data_tests: [not_null]

  - name: stg_exchange_rates
    columns:
      - name: rate_date
        data_tests: [not_null, unique]
      - name: usd_ngn_rate
        data_tests: [not_null]

  - name: stg_company
    columns:
      - name: ticker
        data_tests: [not_null, unique]

  - name: stg_trades
    columns:
      - name: ticker
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_company')
                field: ticker
      - name: shares
        data_tests: [not_null]
      - name: price_paid
        data_tests: [not_null]