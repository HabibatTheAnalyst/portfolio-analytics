name: daily-portfolio-pipeline

on:
  schedule:
    - cron: "0 17 * * 1-5"   # Mon-Fri 17:00 UTC = 18:00 in Nigeria
  workflow_dispatch:           # manual "Run workflow" button

concurrency:
  group: portfolio-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
      NEON_HOST: ${{ secrets.NEON_HOST }}
      NEON_USER: ${{ secrets.NEON_USER }}
      NEON_PASSWORD: ${{ secrets.NEON_PASSWORD }}
      NEON_DB: ${{ secrets.NEON_DB }}
      APILAYER_KEY: ${{ secrets.APILAYER_KEY }}
      AIRBYTE_CLIENT_ID: ${{ secrets.AIRBYTE_CLIENT_ID }}
      AIRBYTE_CLIENT_SECRET: ${{ secrets.AIRBYTE_CLIENT_SECRET }}
      AIRBYTE_CONNECTION_IDS: ${{ secrets.AIRBYTE_CONNECTION_IDS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 1. Load stock prices (yfinance)
        run: python get-tickers.py

      - name: 2. Load exchange rates
        run: python get-exchange-rates.py

      - name: 3. Trigger Airbyte sync (trade log)
        run: python trigger_airbyte.py

      - name: Check dbt variables
        run: |
          for v in neon_host neon_user neon_password neon_db; do
            val="${!v}"
            echo "$v length: ${#val}"
          done
          
      - name: 4. dbt deps
        working-directory: dbt
        run: dbt deps --profiles-dir .

      - name: 5. dbt run
        working-directory: dbt
        run: dbt run --profiles-dir .

      - name: 6. dbt test
        working-directory: dbt
        run: dbt test --profiles-dir .